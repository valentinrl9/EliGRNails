<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Eli·GR — cartel escaparate A4</title>
  <style>
    @font-face {
      font-family: "Playfair Display";
      font-style: italic;
      font-weight: 500;
      src: url("fonts/playfair-italic-500.ttf") format("truetype");
    }
    @font-face {
      font-family: "Playfair Display";
      font-style: italic;
      font-weight: 600;
      src: url("fonts/playfair-italic-600.ttf") format("truetype");
    }
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 300;
      src: url("fonts/poppins-300.ttf") format("truetype");
    }
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 400;
      src: url("fonts/poppins-400.ttf") format("truetype");
    }
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 500;
      src: url("fonts/poppins-500.ttf") format("truetype");
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 210mm;
      height: 297mm;
      overflow: hidden;
      background: #070707;
    }

    .sheet {
      width: 210mm;
      height: 297mm;
      position: relative;
      overflow: hidden;
      background: #070707;
      color: #f4efe8;
    }

    .photo {
      position: absolute;
      left: 0;
      top: 0;
      width: 210mm;
      height: 208mm;
      object-fit: cover;
      object-position: 62% 38%;
    }

    .veil {
      position: absolute;
      left: 0;
      right: 0;
      top: 148mm;
      height: 68mm;
      background: linear-gradient(to bottom, rgba(7, 7, 7, 0) 0%, rgba(7, 7, 7, 0.72) 46%, #070707 100%);
    }

    .lockup {
      position: absolute;
      top: 10mm;
      left: 11mm;
      display: flex;
      align-items: center;
      gap: 3.2mm;
    }

    .lockup img {
      width: 15mm;
      height: auto;
      display: block;
    }

    .lockup span {
      font-family: "Poppins", sans-serif;
      font-weight: 500;
      font-size: 9pt;
      letter-spacing: 0.32em;
      color: #f4efe8;
    }

    .copy {
      position: absolute;
      left: 12mm;
      right: 12mm;
      top: 203mm;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 46pt;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: #f7f2eb;
    }

    .sub {
      margin: 5.5mm 0 0;
      font-family: "Poppins", sans-serif;
      font-weight: 300;
      font-size: 11.5pt;
      letter-spacing: 0.045em;
      color: #f4efe8;
    }

    .rule {
      width: 16mm;
      height: 0.45mm;
      margin: 5.5mm auto 0;
      background: #e00080;
    }

    .qrs {
      position: absolute;
      left: 14mm;
      right: 14mm;
      bottom: 12mm;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .qr {
      width: 82mm;
      text-align: center;
    }

    .qr img {
      width: 34mm;
      height: 34mm;
      background: #fff;
      padding: 2.2mm;
      display: inline-block;
    }

    .qr strong {
      display: block;
      margin-top: 3.2mm;
      font-family: "Poppins", sans-serif;
      font-weight: 500;
      font-size: 9.5pt;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: #f4efe8;
    }

    .qr span {
      display: block;
      margin-top: 1.2mm;
      font-family: "Poppins", sans-serif;
      font-weight: 300;
      font-size: 8pt;
      letter-spacing: 0.04em;
      color: #b7b1a8;
    }
  </style>
</head>
<body>
  <article class="sheet">
    <img class="photo" src="assets/pendiente.jpg" alt="">
    <div class="veil"></div>
    <div class="lockup">
      <img src="assets/marca.png" alt="">
      <span>ELI·GR</span>
    </div>
    <div class="copy">
      <h1>En la oreja.</h1>
      <p class="sub">Se hace aquí. Se vende aquí.</p>
      <div class="rule"></div>
    </div>
    <div class="qrs">
      <div class="qr">
        <img src="assets/qr-que-es.png" alt="Código QR hacia pendinails.com">
        <strong>QUÉ ES</strong>
        <span>pendinails.com</span>
      </div>
      <div class="qr">
        <img src="assets/qr-salon.png" alt="Código QR hacia Google Maps">
        <strong>EL SALÓN</strong>
        <span>Google Maps</span>
      </div>
    </div>
  </article>
</body>
</html>
